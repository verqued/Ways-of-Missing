<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>한 편의 영화를 놓치는 두 가지 방법</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="한 편의 영화를 놓치는 두 가지 방법" />
    <meta property="og:description" content="최정빈, 한산" />
    <meta property="og:image" content="assets/guidelines/web-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1450" />
    <meta property="og:image:height" content="752" />
    <meta property="og:image:alt" content="유주얼 서스펙트 웹 미리보기" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="한 편의 영화를 놓치는 두 가지 방법" />
    <meta name="twitter:description" content="최정빈, 한산" />
    <meta name="twitter:image" content="assets/guidelines/web-preview.png" />
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
    <script>
      if (/Instagram|FBAN\/Instagram|FB_IAB/i.test(navigator.userAgent || "")) {
        document.documentElement.classList.add("is-instagram-browser");
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="orientation-gate" aria-label="화면 회전 안내">
      <div class="orientation-gate__content">
        <strong id="orientation-message">가로로 돌려주세요.</strong>
        <p class="orientation-gate__browser-help">화면이 회전되지 않으면 외부 브라우저를 사용해 주세요.</p>
        <div class="orientation-gate__actions">
          <a
            class="instagram-external-browser"
            id="instagram-external-browser"
            href="https://verqued.github.io/Ways-of-Missing/"
            rel="noopener noreferrer"
          >외부 브라우저에서 열기</a>
          <button class="instagram-copy-link" id="instagram-copy-link" type="button">주소 복사</button>
        </div>
        <p class="instagram-external-browser__note" id="instagram-external-browser-note" aria-live="polite">
          열리지 않으면 오른쪽 위 메뉴에서 외부 브라우저로 열기를 선택해 주세요.
        </p>
      </div>
    </aside>

    <aside class="camera-gate" id="camera-gate" aria-label="가이드라인 및 카메라 허용" hidden>
      <img class="camera-gate__artwork camera-gate__artwork--before" src="assets/guidelines/guideline-1.svg" alt="" aria-hidden="true" />
      <img class="camera-gate__artwork camera-gate__artwork--loading" src="assets/guidelines/guideline-3.svg" alt="" aria-hidden="true" />
      <img class="camera-gate__artwork camera-gate__artwork--allowed" src="assets/guidelines/guideline-2.svg" alt="" aria-hidden="true" />
      <div class="camera-gate__inner">
        <p>가이드라인 텍스트입니다.</p>
        <p>아래 카메라 허용 버튼을 눌러 카메라를 허용해주세요.</p>
        <button id="camera-start" type="button"><span>카메라 허용</span></button>
        <p class="keyboard-guide-dismiss-copy">이후 키보드에서 Q를 눌러 가이드라인 텍스트를 꺼주세요.</p>
      </div>
      <button
        class="mobile-guide-dismiss"
        id="mobile-guide-dismiss"
        type="button"
        aria-label="Q를 터치하여 가이드라인 닫기"
      ><span>Q</span></button>
    </aside>

    <aside
      class="idle-omission-prompt"
      id="idle-omission-prompt"
      aria-label="얼굴 위치와 스크롤 안내"
      aria-live="assertive"
      hidden
    >
      <img class="idle-omission-prompt__base" src="assets/guidelines/idle-cover-base.svg" alt="얼굴을 화면 중앙에 오도록 위치해 주세요. 화살표 키를 눌러 아래로 스크롤해 주세요." />
    </aside>

    <div class="camera-hud" id="camera-hud" hidden>
      <div class="camera-monitor" id="camera-monitor">
        <video
          class="camera-video"
          id="camera-video"
          aria-label="실시간 카메라 영상"
          autoplay
          muted
          playsinline
        ></video>
      </div>
      <div class="eye-open-meter" aria-live="polite">
        <span class="eye-open-meter__label">눈을 뜬 시간</span>
        <strong class="eye-open-meter__value" id="eye-open-duration">0.0초</strong>
        <span class="eye-open-meter__level" id="omission-level">단어 생략</span>
        <span class="eye-open-meter__action" id="omission-action">단어 1개 생략</span>
      </div>
    </div>

    <main id="slides">
      <section class="opening-blank opening-cover slide--word-vector" id="slide-cover" data-editor-folder="표지" aria-label="표지">
      </section>

      <!-- TODO(final): Remove data-editor-folder and the editor folder badges before release. -->
      <section class="slide slide--word-vector" id="slide-1" data-editor-folder="1" aria-label="1번 슬라이드">
      </section>

      <section class="slide slide--word-vector" id="slide-2" data-editor-folder="2" aria-label="2번 슬라이드">
      </section>

      <section class="slide slide--word-vector" id="slide-3" data-editor-folder="3" aria-label="3번 슬라이드">
      </section>

      <section class="slide slide--word-vector" id="slide-4" data-editor-folder="4" aria-label="4번 슬라이드">

      <section class="slide slide--word-vector" id="slide-9" data-editor-folder="9" aria-label="9번 슬라이드">

      <section class="slide slide--word-vector" id="slide-10" data-editor-folder="10" aria-label="10번 슬라이드">

      <section class="slide slide--word-vector" id="slide-11" data-editor-folder="11" aria-label="11번 슬라이드">

      <section class="slide slide--word-vector" id="slide-12" data-editor-folder="12" aria-label="12번 슬라이드">
      </section>

      <section class="slide slide--word-vector" id="slide-13" data-editor-folder="13" aria-label="13번 슬라이드">

      <section class="slide slide--word-vector" id="slide-14" data-editor-folder="14" aria-label="14번 슬라이드">

      <section class="slide slide--word-vector" id="slide-17" data-editor-folder="17" aria-label="17번 슬라이드">

      <section class="slide slide--word-vector" id="slide-18" data-editor-folder="18" aria-label="18번 슬라이드">
      </section>

      <section class="slide slide--word-vector" id="slide-19" data-editor-folder="19" aria-label="19번 슬라이드">
      </section>

      <section class="opening-blank ending-blank" aria-label="빈 마지막 화면">
        <div class="opening-blank__page" aria-hidden="true"></div>
      </section>
    </main>
